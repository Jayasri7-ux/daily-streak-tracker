name: Daily GitHub Streak Maintainer

on:
  schedule:
    # Runs automatically every day at 04:30 UTC (10:00 AM IST)
    # Works 100% in the cloud even when your laptop is turned off!
    - cron: '30 4 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-streak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Python Daily Streak Script
        run: python auto_streak.py --min 1 --max 3
